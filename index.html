<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aventura en Medellín: La Villa del Aburrá - Game Boy Color Edition</title>
  <link rel="stylesheet" href="style.css?v=1793514500">
</head>
<body>

  <!-- Barra superior retro: Selector de niveles y audio rápido (sin botones de spawn) -->
  <div class="gbc-top-bar">
    <button class="gbc-top-btn" id="btnToggleMusic" title="Activar/Desactivar Música">🎵 MÚSICA: OFF</button>
    <div class="gbc-stage-group">
      <button class="gbc-top-btn gbc-stage-btn active" id="btnStage1">NIVEL 1</button>
      <button class="gbc-top-btn gbc-stage-btn" id="btnStage2">NIVEL 2</button>
      <button class="gbc-top-btn gbc-stage-btn" id="btnStage3">NIVEL 3</button>
    </div>
    <button class="gbc-top-btn" id="btnFullscreen" title="Pantalla Completa">⛶ PANTALLA</button>
  </div>

  <!-- Carcasa estilo Nintendo Game Boy Color (Atomic Purple / Retro Arcade) -->
  <div class="gbc-console" id="gbcConsole">
    
    <!-- Bisel oscuro de la pantalla (Screen Bezel) -->
    <div class="gbc-screen-bezel">
      <!-- Indicador LED de encendido -->
      <div class="gbc-bezel-top">
        <div class="gbc-power-indicator">
          <span class="power-led"></span>
          <span class="power-text">POWER</span>
        </div>
        <div class="gbc-stripes">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Pantalla activa del juego (Canvas 16:9) -->
      <div class="screen-wrapper" id="screenWrapper">
        <canvas id="gameCanvas" tabindex="0" autofocus></canvas>
      </div>

      <!-- Logotipo emblemático GAME BOY COLOR -->
      <div class="gbc-logo-bar">
        <span class="gb-text">GAME BOY</span>
        <span class="gb-color">
          <span class="c-red">C</span><span class="c-yellow">O</span><span class="c-green">L</span><span class="c-blue">O</span><span class="c-violet">R</span>
        </span>
      </div>
    </div>

    <!-- Panel de controles táctiles ergonómicos para celular (sin Select/Start, botones alineados hacia adentro) -->
    <div class="gbc-controls-deck" id="touchControls">
      
      <!-- LADO IZQUIERDO: Cruceta D-Pad clásica Game Boy -->
      <div class="gbc-dpad-section">
        <div class="gbc-dpad">
          <button class="gbc-dpad-btn dpad-up" id="btnUp" aria-label="Arriba">▲</button>
          <button class="gbc-dpad-btn dpad-left" id="btnLeft" aria-label="Izquierda">◀</button>
          <div class="gbc-dpad-center"></div>
          <button class="gbc-dpad-btn dpad-right" id="btnRight" aria-label="Derecha">▶</button>
          <button class="gbc-dpad-btn dpad-down" id="btnDown" aria-label="Abajo">▼</button>
        </div>
      </div>

      <!-- LADO DERECHO: Botones de Acción (A, B, ACCIÓN, ESPECIAL, RUN) movidos hacia la izquierda -->
      <div class="gbc-action-section">
        
        <!-- Fila superior: ESPECIAL [E], ACCIÓN / HABLAR [F] y CORRER [RUN] -->
        <div class="gbc-sub-row">
          <button class="gbc-action-btn btn-special" id="btnKick" title="Especial 360°">
            <span class="btn-main-label">SP</span>
            <span class="btn-sub-label">GIRO</span>
          </button>
          <button class="gbc-action-btn btn-interact" id="btnInteract" title="Acción / Hablar con Doña Gloria / Torniquete">
            <span class="btn-main-label">F</span>
            <span class="btn-sub-label">ACCIÓN</span>
          </button>
          <button class="gbc-action-btn btn-dash" id="btnRun" title="Correr / Dash">
            <span class="btn-main-label">⚡</span>
            <span class="btn-sub-label">RUN</span>
          </button>
        </div>

        <!-- Fila principal inclinada: B (Golpe) y A (Salto) estilo Game Boy Color -->
        <div class="gbc-main-row">
          <button class="gbc-action-btn btn-punch" id="btnPunch" title="Golpe / Combo 4 golpes">
            <span class="btn-main-label">B</span>
            <span class="btn-sub-label">GOLPE</span>
          </button>
          <button class="gbc-action-btn btn-jump" id="btnJump" title="Salto / Doble Salto">
            <span class="btn-main-label">A</span>
            <span class="btn-sub-label">SALTO</span>
          </button>
        </div>

      </div>

      <!-- Rejilla de altavoz Game Boy Color (Speaker Grille) -->
      <div class="gbc-speaker-grille">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

    </div>

    <!-- Leyenda de controles de teclado para PC (oculta en móviles) -->
    <div class="controls-legend">
      <div class="control-item">
        <span class="key-badge">W / A / S / D</span> o <span class="key-badge">Flechas</span> Moverse
      </div>
      <div class="control-item">
        <span class="key-badge">Espacio</span> Salto / Doble Salto
      </div>
      <div class="control-item">
        <span class="key-badge">Q / J</span> Combo 4 Golpes
      </div>
      <div class="control-item">
        <span class="key-badge">E / K</span> Especial 360°
      </div>
      <div class="control-item">
        <span class="key-badge">F / Enter</span> <strong>Acción / Hablar</strong>
      </div>
      <div class="control-item">
        <span class="key-badge">Shift</span> Correr
      </div>
      <div class="control-item">
        <span class="key-badge">1 / 2 / 3</span> Cambiar Nivel | <span class="key-badge">M</span> Música
      </div>
    </div>

  </div>

  <!-- Scripts del juego -->
  <script src="audio.js?v=1793514500"></script>
  <script src="sprites.js?v=1793514500"></script>
  <script src="game.js?v=1793514500"></script>

  <script>
    // Selector de niveles interactivo con estado activo
    function updateActiveStageButton(stageNum) {
      document.querySelectorAll('.gbc-stage-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btnStage' + stageNum);
      if (activeBtn) activeBtn.classList.add('active');
    }
    window.updateActiveStageButton = updateActiveStageButton;

    document.getElementById('btnStage1').addEventListener('click', function() {
      if (window.medellinGame) {
        window.medellinGame.switchStage(1);
        updateActiveStageButton(1);
      }
    });

    document.getElementById('btnStage2').addEventListener('click', function() {
      if (window.medellinGame) {
        window.medellinGame.switchStage(2);
        updateActiveStageButton(2);
      }
    });

    document.getElementById('btnStage3').addEventListener('click', function() {
      if (window.medellinGame) {
        window.medellinGame.switchStage(3);
        updateActiveStageButton(3);
      }
    });

    // Control de música
    document.getElementById('btnToggleMusic').addEventListener('click', function() {
      window.retroAudio.init();
      const isPlaying = window.retroAudio.toggleBgm();
      this.textContent = isPlaying ? "🎵 MÚSICA: ON" : "🎵 MÚSICA: OFF";
      this.style.color = isPlaying ? "#2ecc71" : "#f1c40f";
    });

    // Pantalla completa
    document.getElementById('btnFullscreen').addEventListener('click', function() {
      const el = document.getElementById('gbcConsole') || document.getElementById('screenWrapper');
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // Desbloqueo de audio nativo para móviles (iOS / Android) en el primer toque de pantalla
    const unlockAudio = () => {
      if (window.retroAudio && window.retroAudio.init) {
        try { window.retroAudio.init(); } catch (err) {}
      }
    };
    window.addEventListener('touchstart', unlockAudio, { passive: true, once: true });
    window.addEventListener('click', unlockAudio, { once: true });
  </script>
</body>
</html>
